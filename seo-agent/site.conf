# Settings for this website's SEO agent. The tools in this kit are the same for every site;
# only this file, PROMPT.md and the *.default/*.template files differ.
SITE_NAME="House of Senses"
DEFAULT_HOME="$HOME/.seo-agent-hos"
DEFAULT_SITE_URL="https://houseofsenses.vn"
DEFAULT_PAYLOAD_URL="https://admin.houseofsenses.vn"
BE_HEALTH_PATH="/api/tenants?limit=1&depth=0"
BE_REMOTE="hos-be"
CRON_TAG="houseofsenses-seo-agent"
# Nightly run time, Vietnam time (after the Skill & Mix agent; they take turns anyway)
CRON_VN_HOUR=3
CRON_MINUTE=45
# Our pages the competitor report compares against (paths on the main site, or full URLs);
# state/our-pages.txt overrides this list when new branches open.
OUR_PAGES="https://houseofsenses.vn/ https://red-space.houseofsenses.vn/ https://red-space.houseofsenses.vn/vi https://red-space.houseofsenses.vn/menu https://blue-bistro.houseofsenses.vn/ https://blue-bistro.houseofsenses.vn/menu"
# Which pages of a competitor's sitemap are worth studying (words in the URL)
TOPIC_STRONG="nha-hang|restaurant|bistro|trattoria|quan-an|quan-3|district-3"
TOPIC_MEDIUM="menu|thuc-don|am-thuc|dining|food|dat-ban|reservation|hen-ho|date|sai-gon|saigon|ho-chi-minh"
TOPIC_EXCLUDE="tuyen-dung|recruit|career|job"
# What the agent's CMS account needs (shown by install.sh)
CMS_ROLE_HELP="Roles: create \"SEO Agent\" with only: Branch settings & website: Edit, and Media library: Edit. Nothing else (no reservations, customers, vouchers, people or roles). People: create user \"SEO Agent\", give it that role at every branch, tick \"Enable API Key\", save, copy the key."
